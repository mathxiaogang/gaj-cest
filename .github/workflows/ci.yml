name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: tests
        run: python -m pytest tests -q
        env:
          PYTHONPATH: src
      - name: smoke test of the CLI and the demo
        run: |
          python -m gaj.cli info
          python experiments/real_data_demo.py --csv data/phantom_zspectrum.csv --starts 2 --no-figure
        env:
          PYTHONPATH: src
